<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Online Examination System</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="brand-header">
            <div class="brand-logo">🔒</div>
            <h1>Reset Password</h1>
            <p>Set a new password for your account</p>
        </div>

        <div id="reset-msg" class="alert" role="alert"></div>

        <form id="reset-form" novalidate>
            <div class="form-group">
                <label for="reset-password">New Password (8-20 characters)</label>
                <input type="password" id="reset-password" class="input-control" placeholder="••••••••" required>
                <span id="err-password" class="field-error"></span>
            </div>

            <div class="form-group">
                <label for="reset-confirm">Confirm New Password</label>
                <input type="password" id="reset-confirm" class="input-control" placeholder="••••••••" required>
                <span id="err-confirm_password" class="field-error"></span>
            </div>

            <button type="submit" id="reset-btn" class="btn-primary">Reset Password</button>
        </form>

        <div class="auth-footer">
            Back to <a href="/login" class="link-btn">Login Page</a>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/reset_password.js"></script>
</body>
</html>
