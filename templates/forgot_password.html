<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Online Examination System</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="brand-header">
            <div class="brand-logo">🔑</div>
            <h1>Forgot Password</h1>
            <p>Enter your registered email to receive a password reset link</p>
        </div>

        <div id="forgot-msg" class="alert" role="alert"></div>

        <form id="forgot-form" novalidate>
            <div class="form-group">
                <label for="forgot-email">Registered Email Address</label>
                <input type="email" id="forgot-email" class="input-control" placeholder="e.g. alice@student.com" required>
                <span id="err-email" class="field-error"></span>
            </div>

            <button type="submit" id="forgot-btn" class="btn-primary">Send Reset Link</button>
        </form>

        <div id="demo-token-display" style="display: none;"></div>

        <div class="auth-footer">
            Remembered your password? <a href="/login" class="link-btn">Back to Login</a>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/forgot_password.js"></script>
</body>
</html>
